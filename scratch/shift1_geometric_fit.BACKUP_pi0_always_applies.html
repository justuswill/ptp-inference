const root = document.getElementById('root');
const tooltip = document.getElementById('tooltip');
const ns = 'http://www.w3.org/2000/svg';
function el(tag, attrs) {
  const e = document.createElementNS(ns, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

datasets.forEach(ds => {
  const card = document.createElement('div');
  card.className = 'card';

  const cs = getComputedStyle(root);
  const seriesColor = cs.getPropertyValue(ds.seriesVar).trim();
  const mutedColor = cs.getPropertyValue('--text-muted').trim();

  // ds.curves (4-fit panels) vs. the legacy single-fit 'base' panel.
  const curves = ds.curves
    ? ds.curves.map(c => ({ ...c, color: cs.getPropertyValue(c.colorVar).trim() }))
    : [{ label: 'fitted Geometric', color: mutedColor, values: ds.pred }];

  const formulaHtml = ds.formula
    ? ds.formula
    : `G = ${ds.shift} + Geometric(p) &nbsp;&middot;&nbsp; p&#770; = ${ds.p.toFixed(3)} &nbsp;&middot;&nbsp; R&sup2; = ${ds.r2.toFixed(3)}`;
  const paramsFormula = ds.curves ? `<p class="formula">${sharedFitParams}</p>` : '';
  const r2Formula = ds.curves
    ? `<p class="formula">R&sup2; &mdash; ${curves.map(c => `${c.label}: ${c.r2.toFixed(3)}`).join(' &nbsp;&middot;&nbsp; ')}</p>`
    : '';
  const legendItems = curves.map(c =>
    `<div class="legend-item"><span class="legend-swatch-line" style="border-color:${c.color}"></span>${c.label}</div>`
  ).join('');

  card.innerHTML = `
    <h1>${ds.title}</h1>
    <p class="subtitle">${ds.subtitle}</p>
    <p class="formula">${formulaHtml}</p>
    ${paramsFormula}
    ${r2Formula}
    <div class="legend">
      <div class="legend-item"><span class="legend-swatch-bar" style="background:${seriesColor}"></span>observed</div>
      ${legendItems}
    </div>
  `;

  const svg = el('svg', { width: 696, height: 360 });
  const W = 696, H = 360;
  const margin = { top: 14, right: 14, bottom: 34, left: 40 };
  const plotW = W - margin.left - margin.right;
  const plotH = H - margin.top - margin.bottom;

  const n = ds.obs.length;
  const maxVal = Math.max(...ds.obs, ...[].concat(...curves.map(c => c.values)));
  const yMax = Math.ceil(maxVal * 100 / 5) * 5 / 100;

  const slot = plotW / n;
  const barW = Math.min(24, slot - 4);
  const xCenter = (i) => margin.left + slot * i + slot / 2;
  const yScale = (v) => margin.top + plotH - (v / yMax) * plotH;

  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const v = (yMax / yTicks) * i;
    const y = yScale(v);
    svg.appendChild(el('line', { x1: margin.left, x2: W - margin.right, y1: y, y2: y, class: 'gridline' }));
    const t = el('text', { x: margin.left - 6, y: y + 3, class: 'axis-label', 'text-anchor': 'end' });
    t.textContent = Math.round(v * 100) + '%';
    svg.appendChild(t);
  }
  svg.appendChild(el('line', { x1: margin.left, x2: W - margin.right, y1: yScale(0), y2: yScale(0), class: 'baseline' }));

  for (let i = 0; i < n; i++) {
    const count = ds.obs[i];
    const x = xCenter(i) - barW / 2;
    const yTop = yScale(count);
    const yBase = yScale(0);
    const h = Math.max(0, yBase - yTop);
    const r = h > 0 ? Math.min(4, h) : 0;
    let d = '';
    if (h > 0) {
      d = `M ${x} ${yBase} L ${x} ${yTop + r} Q ${x} ${yTop} ${x + r} ${yTop} L ${x + barW - r} ${yTop} Q ${x + barW} ${yTop} ${x + barW} ${yTop + r} L ${x + barW} ${yBase} Z`;
    }
    const path = el('path', { d, fill: seriesColor });
    path.addEventListener('mousemove', (ev) => {
      const curveTxt = curves.map(c => ` &middot; ${c.label} ${(c.values[i]*100).toFixed(2)}%`).join('');
      tooltip.innerHTML = `<div class="row"><span class="label">G=${i}</span><span class="val">obs ${(count*100).toFixed(2)}%${curveTxt}</span></div>`;
      tooltip.style.opacity = 1;
      tooltip.style.left = (ev.clientX + 14) + 'px';
      tooltip.style.top = (ev.clientY - 10) + 'px';
    });
    path.addEventListener('mouseleave', () => tooltip.style.opacity = 0);
    svg.appendChild(path);

    if (i % 2 === 0 || i === n - 1) {
      const lbl = el('text', { x: xCenter(i), y: yScale(0) + 16, class: 'axis-label', 'text-anchor': 'middle' });

// --- P(T=1) vs k: real 100-question-run datasets only (k=1,2,5,50,1000) ---
const kSweep = [
  { k: 1,    p: 0.33446, n: 4159, label: 'seq-ptp' },
  { k: 2,    p: 0.29196, n: 3843, label: 'choice-2' },
  { k: 5,    p: 0.21025, n: 3472, label: 'choice-5' },
  { k: 50,   p: 0.13571, n: 3139, label: 'choice-50' },
  { k: 1000, p: 0.10928, n: 2919, label: 'seq-n-choice-1000' },
];
// Only these 5 k's have a real 100-question-run collection. The earlier version
// of this panel also plotted a single-held-out-example sweep at k=3,4,10,20,250 —
// removed, since mixing a one-example estimate with real histogram data made the
// fits (and the panel) inconsistent with the E[G] panel and the joint fits below,
// which only ever used these same 5 datasets.

// Offset power-law fit: p(k) = c + a * k^(-b), least squares over these 5 points.
const kFit = { c: 0.0934, a: 0.2477, b: 0.4295, r2: 0.991 };
const fitP = (k) => kFit.c + kFit.a * Math.pow(k, -kFit.b);

// Zero-inflated Beta-Binomial branching fit: P(T=1;K) = pi0 + (1-pi0)*BetaBinom(0;K,alpha,beta).
// Binomial-likelihood MLE over the exact (k, successes, n) counts from these same 5 datasets.
const branchFit = { pi0: 0.0946, p: 0.7257, rho: 0.6297, r2: 0.990 };
// "E[T] fit": NLS against E[G] means from the FIVE 100-question-run datasets only
// (seq-ptp K=1, choice-2 K=2, choice-5 K=5, choice-50 K=50, seq-n-choice-1000 K=1000) —
// no disk-table / single-example data used here.
const branchFitDisk = { pi0: 0.1882, p: 0.8375, rho: 0.6745, r2: 0.999 };
// Joint fit sharing (pi0,p,rho) across all 5 real per-call histogram datasets
// (seq-ptp K=1, choice-2 K=2, choice-5 K=5, choice-50 K=50, seq-n-choice-1000 K=1000), two ways.
const branchFitJointW = { pi0: 0.0737, p: 0.7093, rho: 0.7539 };   // weighted (G=2..5 priority)
const branchFitJointM = { pi0: 0.0000, p: 0.6754, rho: 0.8679 };   // standard MLE (unweighted)
// Lanczos approximation for ln(Gamma(x)), lets P(S=0) extend to non-integer k for a smooth curve.
const LANCZOS_G = 7;
const LANCZOS_C = [
  0.99999999999980993, 676.5203681218851, -1259.1392167224028,
  771.32342877765313, -176.61502916214059, 12.507343278686905,
  -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7,
];
function lnGamma(x) {
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lnGamma(1 - x);
  x -= 1;
  let a = LANCZOS_C[0];
  const t = x + LANCZOS_G + 0.5;
  for (let i = 1; i < LANCZOS_G + 2; i++) a += LANCZOS_C[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function betaBinomZeroPmf(m, alpha, beta) {
  // P(S=0; m,alpha,beta) = B(alpha,beta+m)/B(alpha,beta), via lnGamma so m need not be an integer.
  const lnRatio = (lnGamma(beta + m) - lnGamma(beta)) + (lnGamma(alpha + beta) - lnGamma(alpha + beta + m));
  return Math.exp(lnRatio);
}
function fitBranch(k) {
  const nu = (1 - branchFit.rho) / branchFit.rho;
  const alpha = branchFit.p * nu, beta = (1 - branchFit.p) * nu;
  return branchFit.pi0 + (1 - branchFit.pi0) * betaBinomZeroPmf(k, alpha, beta);
}
function fitBranchDisk(k) {
  const nu = (1 - branchFitDisk.rho) / branchFitDisk.rho;
  const alpha = branchFitDisk.p * nu, beta = (1 - branchFitDisk.p) * nu;
  return branchFitDisk.pi0 + (1 - branchFitDisk.pi0) * betaBinomZeroPmf(k, alpha, beta);
}
function fitBranchJointW(k) {
  const nu = (1 - branchFitJointW.rho) / branchFitJointW.rho;
  const alpha = branchFitJointW.p * nu, beta = (1 - branchFitJointW.p) * nu;
  return branchFitJointW.pi0 + (1 - branchFitJointW.pi0) * betaBinomZeroPmf(k, alpha, beta);
}
function fitBranchJointM(k) {
  const nu = (1 - branchFitJointM.rho) / branchFitJointM.rho;
  const alpha = branchFitJointM.p * nu, beta = (1 - branchFitJointM.p) * nu;
  return branchFitJointM.pi0 + (1 - branchFitJointM.pi0) * betaBinomZeroPmf(k, alpha, beta);
}
