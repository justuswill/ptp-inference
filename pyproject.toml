[project]
name = "ptp"
version = "1.0.0"
description = "Parallel Token Prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ml-collections",
    "transformers==5.3.0",
    "numpy",
    "torch",
    "datasets>=2.14",
    "matplotlib",
    "lightning",
    "wandb",
    "omegaconf",
    "pyyaml",
    "peft",
    "tiktoken",
    "sentencepiece",
    "langdetect",
    "rdkit",
    "hydra-core>=1.3.2",
    "einops>=0.8.2",
    "scipy>=1.17.1",
    "timm>=1.0.27",
    "torchvision>=0.26.0",
]

[project.scripts]
ptp_distill = "ptp.cli.distill:main"
ptp_pregenerate = "ptp.cli.pregenerate:main"
ptp_train = "ptp.cli.train:main"
ptp_generate = "ptp.cli.generate:_parse_args"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptp"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
